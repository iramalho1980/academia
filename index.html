<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10141d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Treinos · Panobianco Castelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1017;--card:rgba(255,255,255,.075);--line:rgba(255,255,255,.12);--text:#f5f7fb;--muted:#aab2c2;--yellow:#eaff00;--accent:#f6d365;--teal:#6ee7d0;--danger:#ff758f;--shadow:0 20px 55px rgba(0,0,0,.3)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:"Ubuntu",-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-weight:300;background:#2c3e50;background:linear-gradient(to right,#3498db,#2c3e50);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{width:min(100%,720px);margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom))}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}.eyebrow{color:var(--yellow);text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:700}h1,h2,h3,.summary-title,.percent,.stat b,.time{font-family:"Ubuntu",sans-serif;font-weight:300}h1{margin:7px 0 0;font-size:clamp(27px,7vw,42px);letter-spacing:-.045em;line-height:1}.date{color:var(--yellow);font-size:13px;margin-top:9px}.icon-btn{width:43px;height:43px;border-radius:15px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;place-items:center;font-size:19px;box-shadow:var(--shadow)}.glass{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.045));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.summary{border-radius:25px;padding:20px;margin-bottom:18px;overflow:hidden;position:relative}.summary:after{content:"";position:absolute;width:145px;height:145px;right:-35px;top:-55px;border-radius:50%;background:var(--accent);opacity:.15;filter:blur(7px)}.summary-head{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.summary-title{font-size:15px;font-weight:500}.percent{font-size:25px;color:var(--yellow)}.bar{height:9px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;margin:15px 0 17px}.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:inherit;transition:width .45s ease}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:11px 12px;border-radius:16px;background:rgba(0,0,0,.18)}.stat b{display:block;font-size:18px}.stat small{color:var(--muted);font-size:11px}.training-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 22px}.training-tab{min-height:69px;text-align:left;padding:11px 10px;border-radius:17px;background:rgba(255,255,255,.075);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:.2s}.training-tab strong{display:block;font-size:14px;font-weight:500}.training-tab small{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.2}.training-tab.active{background:linear-gradient(135deg,rgba(246,211,101,.28),rgba(255,255,255,.07));border-color:rgba(246,211,101,.55);box-shadow:0 10px 30px rgba(0,0,0,.18)}.training-tab.active strong{color:var(--yellow)}.section-label{margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}.section-label h2{font-size:16px;margin:0}.section-label span{color:var(--muted);font-size:12px}.search{display:block;margin-bottom:13px}.search input{width:100%;padding:13px 15px;border-radius:15px;color:var(--text);background:rgba(0,0,0,.18);border:1px solid var(--line);outline:none}.search input::placeholder{color:#8791a3}.search input:focus{border-color:rgba(234,255,0,.5);box-shadow:0 0 0 3px rgba(234,255,0,.08)}.exercise{border-radius:22px;padding:16px;margin:10px 0;transition:transform .2s ease,border-color .2s ease;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.045));}.exercise:hover{transform:translateY(-2px)}.exercise.done{border-color:rgba(110,231,208,.65);background:linear-gradient(135deg,rgba(110,231,208,.16),rgba(255,255,255,.045))}.exercise-row{display:flex;align-items:center;gap:12px}.number{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:11px;background:rgba(246,211,101,.18);color:var(--yellow);font-weight:700;font-size:13px}.exercise h3{margin:0;font-size:16px;letter-spacing:-.01em}.prescription{color:var(--muted);font-size:12px;margin-top:4px}.check{margin-left:auto;width:29px;height:29px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.16);display:grid;place-items:center;font-size:16px;transition:.2s}.done .check{background:var(--teal);color:#0e2825;border-color:var(--teal)}.timer{display:flex;align-items:center;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}.time{min-width:67px;font-variant-numeric:tabular-nums;font-size:18px;font-weight:500;letter-spacing:.03em}.timer-btn{height:37px;padding:0 13px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}.timer-btn.primary{background:var(--yellow);color:#25313d;border-color:transparent}.timer-btn.stop{color:#ffb3c1}.round{margin-left:auto;color:var(--muted);font-size:11px}.details{margin-top:12px;padding-top:11px;border-top:1px solid rgba(234,255,0,.25);color:var(--muted);font-size:12px;line-height:1.5}.details strong{color:var(--yellow);font-weight:400}.bottom-nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),480px);padding:8px;border-radius:20px;display:flex;justify-content:space-around;z-index:5;background:rgba(24,28,39,.78);border:1px solid var(--line);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:0 12px 30px rgba(0,0,0,.4)}.nav-item{background:none;color:var(--muted);padding:8px 17px;border-radius:14px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav-item.active{color:var(--text);background:rgba(255,255,255,.1)}.nav-icon{font-size:19px;line-height:1}.toast{position:fixed;left:50%;bottom:93px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f4f5fa;color:#141721;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:500;transition:.25s;z-index:10;white-space:nowrap}.toast.show{transform:translate(-50%,0);opacity:1}.empty{text-align:center;color:var(--muted);padding:28px 12px}.hidden{display:none}@media(min-width:600px){.app{padding-top:44px}}
</style>
</head>
<body><main class="app"><header class="topbar"><div><div class="eyebrow">Plano de hoje</div><h1 id="pageTitle">Costas & Bíceps</h1><div class="date" id="date"></div></div><button class="icon-btn" id="resetBtn" aria-label="Reiniciar treino">↻</button></header>
<section class="summary glass" id="dashboard"><div class="summary-head"><div class="summary-title">Realizado × Programado</div><div class="percent" id="percent">0%</div></div><div class="bar"><span id="progress"></span></div><div class="stats"><div class="stat"><b id="doneCount">0</b><small>realizados</small></div><div class="stat"><b id="totalCount">7</b><small>programados</small></div><div class="stat"><b id="timeTotal">00:00</b><small>tempo total</small></div></div></section>
<nav class="training-tabs" aria-label="Treinamentos"><button class="training-tab active" data-training="0"><strong>A · Costas</strong><small>Costas e bíceps<br>7 exercícios</small></button><button class="training-tab" data-training="1"><strong>B · Perna</strong><small>6 exercícios<br>Treino do dia</small></button><button class="training-tab" data-training="2"><strong>C · Peito</strong><small>Ombro e tríceps<br>6 exercícios</small></button></nav>
<div class="section-label"><h2>Sequência do treino</h2><span>toque no ✓ ao concluir</span></div><label class="search"><input id="search" type="search" placeholder="Buscar exercício..." autocomplete="off"></label><section id="exerciseList"></section></main>
<nav class="bottom-nav" aria-label="Navegação principal"><button class="nav-item active" data-target="dashboard"><span class="nav-icon">⌂</span>Resumo</button><button class="nav-item" data-target="exerciseList"><span class="nav-icon">▤</span>Exercícios</button></nav><div class="toast" id="toast"></div>
<script>
const plans=[{title:'Costas & Bíceps',items:['Puxada aberta','Puxada triângulo','Remada curvada','Remada aberta','Rosca direta','Rosca 45 no banco','Abdominal supra']},{title:'Perna',items:['Agachamento hack','Leg press 45','Cadeira flexora','Cadeira extensora','Mesa flexora','Panturrilha sentado']},{title:'Peito, Ombro & Tríceps',items:['Fly','Supino inclinado na barra','Desenvolvimento com halter','Elevação lateral','Tríceps corda','Tríceps francês polia']}];
const prescriptions=['3 séries • 10 kg × 12 reps','3 séries • 10 kg × 12 reps','3 séries • 10 kg × 12 reps','3 séries • 10 kg × 12 reps','3 séries • 10 kg × 12 reps','3 séries • 10 kg × 12 reps','3 séries • 12 kg × 15 reps'];const tips={'Puxada aberta':'Puxe a barra ao peito mantendo o tronco estável.','Puxada triângulo':'Conduza os cotovelos para baixo e para trás.','Agachamento hack':'Mantenha os joelhos alinhados aos pés.','Leg press 45':'Não trave os joelhos no topo do movimento.','Fly':'Abra e feche os braços com controle.','Supino inclinado na barra':'Mantenha os pés firmes e desça a barra controladamente.'};
let active=0,activeTimer=null,timerInterval=null;const store='panobianco-treinos-ios-state';let all=JSON.parse(localStorage.getItem(store)||'{}');all.done=all.done||{};all.seconds=all.seconds||{};const $=id=>document.getElementById(id);$('date').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());function key(t,i){return t+'-'+i}function format(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function save(){localStorage.setItem(store,JSON.stringify(all))}
function render(){const plan=plans[active],q=$('search').value.toLowerCase().trim();$('pageTitle').textContent=plan.title;$('totalCount').textContent=plan.items.length;const items=plan.items.map((name,i)=>({name,i})).filter(x=>!q||x.name.toLowerCase().includes(q));$('exerciseList').innerHTML=items.length?items.map((x)=>{const complete=!!all.done[key(active,x.i)];return `<article class="exercise glass ${complete?'done':''}" id="ex-${x.i}"><div class="exercise-row"><div class="number">${String(x.i+1).padStart(2,'0')}</div><div><h3>${x.name}</h3><div class="prescription">${prescriptions[x.i%prescriptions.length]}</div></div><button class="check" data-check="${x.i}" aria-label="Marcar ${x.name} como realizado">${complete?'✓':''}</button></div><div class="timer"><div class="time" id="time-${x.i}">${format(all.seconds[key(active,x.i)]||0)}</div><button class="timer-btn primary" data-start="${x.i}">▶ Iniciar</button><button class="timer-btn stop" data-stop="${x.i}">■ Parar</button><span class="round">cronômetro</span></div><div class="details"><strong>Detalhes</strong> · ${tips[x.name]||'Execute com controle, postura estável e amplitude confortável.'}</div></article>`}).join(''):'<div class="empty">Nenhum exercício encontrado.</div>';updateDashboard()}
function updateDashboard(){const plan=plans[active],done=plan.items.filter((_,i)=>all.done[key(active,i)]).length,pct=Math.round(done/plan.items.length*100);$('doneCount').textContent=done;$('percent').textContent=pct+'%';$('progress').style.width=pct+'%';$('timeTotal').textContent=format(plan.items.reduce((n,_,i)=>n+Number(all.seconds[key(active,i)]||0),0))}function toggleDone(i){const k=key(active,i);all.done[k]=!all.done[k];save();render();showToast(all.done[k]?'Exercício marcado como realizado':'Exercício reaberto')}function start(i){stop(false);activeTimer=i;timerInterval=setInterval(()=>{const k=key(active,i);all.seconds[k]=(all.seconds[k]||0)+1;const time=$('time-'+i);if(time)time.textContent=format(all.seconds[k]);updateDashboard();save()},1000);showToast('Cronômetro iniciado')}function stop(notify=true){if(timerInterval){clearInterval(timerInterval);timerInterval=null;activeTimer=null;if(notify)showToast('Cronômetro parado')}}function showToast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),1800)}
document.addEventListener('click',e=>{const check=e.target.closest('[data-check]'),startBtn=e.target.closest('[data-start]'),stopBtn=e.target.closest('[data-stop]'),tab=e.target.closest('[data-training]'),nav=e.target.closest('[data-target]');if(check)toggleDone(Number(check.dataset.check));if(startBtn)start(Number(startBtn.dataset.start));if(stopBtn)stop();if(tab){stop(false);active=Number(tab.dataset.training);document.querySelectorAll('.training-tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');$('search').value='';render()}if(nav){$(nav.dataset.target).scrollIntoView({behavior:'smooth'});document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));nav.classList.add('active')}});$('search').addEventListener('input',render);$('resetBtn').addEventListener('click',()=>{if(confirm('Reiniciar realizados e cronômetros deste treino?')){stop(false);plans[active].items.forEach((_,i)=>{delete all.done[key(active,i)];delete all.seconds[key(active,i)]});save();render();showToast('Treino reiniciado')}});render();
</script></body></html>
